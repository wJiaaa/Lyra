name: 安装包

# 推 `v*` tag（`pnpm release` 的最后一步）：Windows、macOS 都打，再发布到本仓库（wJiaaa/Plume）的 Release，
# 应用内更新从那里读。手动运行只打包、上传 Artifacts，不发布。
# 手机 App 暂不打包发布（Android runner 每次现下 NDK，最慢，v0.9.33 就因 NDK 下载损坏失败过），有需求再加回来。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 要打包的平台
        type: choice
        # 只需要某一个平台时单独选它，不用等另一个
        options: [all, windows, macos]
        default: all

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 core
        run: pnpm build:core

      - name: 构建 Windows x64 安装包并核验原生模块架构
        run: pnpm --filter @plume/desktop package --win nsis --x64 --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Plume-Windows-x64
          path: packages/desktop/release/Plume-*-x64.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    # 图标是 Icon Composer 的 icon.icon，要 Xcode 26 的 actool 才能编译；
    # 更早的镜像会静默退回 Electron 默认图标
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 core
        run: pnpm build:core

      # 自签证书 Plume Code Signing（make-signing-cert.sh 生成）导进临时钥匙串，package.mjs 找到它就用它签。
      # 证书签名让每次更新在 macOS 看来是同一个应用，屏幕录制等权限不会被重置；ad-hoc 签名做不到，
      # 见 electron-builder.yml 里 mac.identity 的说明。发版（推 tag）时缺证书直接失败，手动打包只警告
      - name: 准备签名证书
        timeout-minutes: 5
        env:
          REQUIRE_SIGNING: ${{ github.event_name == 'push' }}
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/prepare-signing.sh

      # zip 给应用内更新用：它直接装着 Plume.app，可以原地替换；dmg 给第一次手动安装
      - name: 构建 macOS 安装包（arm64 与 x64）并核验原生模块架构
        run: pnpm --filter @plume/desktop package --mac dmg zip --arm64 --x64 --publish never

      # 证书没导进去时 electron-builder 会悄悄退回 ad-hoc，包照样能装能跑，只是权限每次更新都被重置
      - name: 核验签名身份
        env:
          REQUIRE_SIGNING: ${{ github.event_name == 'push' }}
          HAVE_CERT: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
        run: bash .github/scripts/check-signature.sh

      - name: 上传安装包
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Plume-macOS
          path: |
            packages/desktop/release/Plume-*.dmg
            packages/desktop/release/Plume-*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 收齐各平台安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # 应用内更新先按文件名在这里查到校验值，对得上才安装；没有这个文件就不装（update-checksum.ts）
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # 正文取 CHANGELOG 里这个版本的两段手写说明；应用按界面语言只显示其中一段（notes-locale.ts）
      - name: 发布到本仓库 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/changelog-section.mjs "$TAG" > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
