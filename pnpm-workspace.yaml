packages:
  - "packages/*"

# Introduced because native Android tools enforce MAX_PATH on Windows, including paths inside
# pnpm's store. 原生手机端也沿用此限制，避免 Windows 安装路径过长。
virtualStoreDirMaxLength: 16

# Markdown 渲染器依赖的旧版 markdown-it 在 Node 用内置 punycode；原生端需要显式依赖。
packageExtensions:
  "markdown-it@10":
    dependencies:
      punycode: "^2.3.1"

allowBuilds:
  # Downloads the Electron binary.
  electron: true
  # Fetches the platform-specific esbuild binary used by Vite.
  esbuild: true
  # Windows installer toolchain; not needed to develop or run the app.
  electron-winstaller: false
  # Builds the pseudo-terminal addon the terminal panel runs on. Compiled against Node here,
  # then rebuilt against Electron's ABI by the desktop package's postinstall.
  node-pty: true
  # Installs the git hook binary; the hooks are what keep lint and typecheck from being optional.
  lefthook: true
  koffi: false
  # Unpacks the workerd binary. It is what `wrangler dev` runs the registry Worker on locally,
  # so without this the platform can only be tested by deploying it.
  workerd: true

# Transitive dependencies pinned past a published advisory.
#
# Every one of these is something we do not depend on directly — they arrive under the MCP SDK and
# other dependencies — so there is no version of ours to bump. An override is the only lever, and it
# is the right one: these are patch-level fixes to packages whose API we never touch.
#
# `fast-uri` is the one that matters most here. It parses URLs under ajv, two of its three
# advisories are server-side request forgery, and this application fetches URLs the model
# produced. The others are denial-of-service in parsers reached by paths that a desktop app does
# not expose, but they are free to fix.
#
# Reviewed when a dependency bump lands: an override that outlives the vulnerable range is a pin
# nobody asked for. `pnpm audit --prod` says when one can go.
overrides:
  fast-uri: ">=3.1.6"
  qs: ">=6.15.4"
  uuid: ">=11.1.1"
  lodash-es: ">=4.17.24"
  # 手机端 Markdown 用的 markdown-it@10 只认 linkify-it ^2，而两条二次复杂度的 DoS（GHSA-22p9-wv53-3rq4、
  # GHSA-v245-v573-v5vm）到 5.0.2 才修。markdown-it@10 只用 LinkifyIt 的构造、test/match/pretest，
  # 这几个在 5.x 里签名没变；不跨到 6，6 起只发 ESM，require 不进来。
  "markdown-it@10>linkify-it": "^5.0.2"

# 没有修复版可升的 advisory，按编号逐条忽略。
#
# 两条的最新发布版就是受影响的那一版：GitHub 上没有 patched version，`pnpm audit` 打出来的
# `>=x.y.z` 只是受影响范围的补集。刷 lockfile、加 override 都没有可去的版本，剩下的办法只有不用
# Expo。两者都不会在用户机器上加载：
# - GHSA-86w9-cpqp-85rv，node-forge <=1.4.0，接受伪造的 RSA PKCS#1 v1.5 签名。只在 `@expo/cli`
#   底下，那是手机端的构建和开发服务器工具，不进应用包，应用也不校验任何更新签名。
# - GHSA-vfj7-8cjw-p6xm，braces <=3.0.3，嵌套很深的花括号模式会耗尽栈。在 metro 和 stylelint 等
#   构建、检查工具底下，展开的是本仓库自己配置里的 glob。
#
# 一个编号只藏那一条，同一个包再出新的照样报。有了修复版就删掉对应的行：
# `pnpm view node-forge version` 过了 1.4.0、`pnpm view braces version` 过了 3.0.3。
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260818.1'

# Which platforms to install optional dependencies for, rather than just this machine's.
#
# Prebuilt native modules ship as one package per platform, and pnpm installs only the one the
# installing machine needs. Every release job then packages architectures that machine is not: the
# Windows runner is x64 and builds x64 *and* arm64, the macOS runner is arm64 and builds both, the
# Linux runner is x64 and builds both. So `koffi` went into the arm64 Windows installer as
# `@koromix/koffi-win32-x64`, and into the x64 macOS build as `@koromix/koffi-darwin-arm64` — the
# wrong architecture in every non-native artifact, in every release up to 0.8.35.
#
# It stayed invisible because nothing announces it. The build succeeds, the app launches, and
# `koffi` is `require`d lazily from the Windows sandbox path alone — so the only way to meet it is
# to run that path on an arm64 Windows machine. `node-pty` is not affected: it is compiled rather
# than downloaded, and electron-builder rebuilds it for the architecture being packaged.
#
# `current` stays in both lists so that a machine outside these combinations still installs what it
# needs to run the app.
supportedArchitectures:
  os:
    - current
    - win32
    - darwin
    - linux
  cpu:
    - current
    - x64
    - arm64

# 退出时 JS 已停用，原生终端回调仍尝试抛异常会导致 SIGABRT；上游修复后移除此补丁。
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
